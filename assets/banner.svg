<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="1200" height="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdf2f8"/>
      <stop offset="1" stop-color="#fbcfe8"/>
    </linearGradient>
    <marker id="solid" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#db2777"/>
    </marker>
    <marker id="open" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#db2777" stroke-width="1.6"/>
    </marker>
  </defs>

  <clipPath id="card">
    <rect width="1200" height="240" rx="18"/>
  </clipPath>

  <rect width="1200" height="240" rx="18" fill="url(#bg)"/>
  <g clip-path="url(#card)">
    <circle cx="1130" cy="30" r="90" fill="#f9a8d4" opacity="0.35"/>
    <circle cx="760" cy="250" r="70" fill="#f9a8d4" opacity="0.3"/>
  </g>

  <!-- title -->
  <text x="64" y="84" font-size="15" font-weight="600" letter-spacing="3" fill="#be185d">THE UNIVERSITY OF ALABAMA</text>
  <text x="64" y="150" font-size="60" font-weight="800" fill="#9d174d">CS 200 · Team 37</text>
  <text x="64" y="192" font-size="22" fill="#be185d">Software Engineering · Fall 2026</text>

  <!-- little sequence diagram doodle -->
  <g stroke="#ec4899" stroke-width="2" fill="none" stroke-linecap="round">
    <circle cx="860" cy="52" r="8"/>
    <line x1="860" y1="60" x2="860" y2="80"/>
    <line x1="848" y1="68" x2="872" y2="68"/>
    <line x1="860" y1="80" x2="850" y2="94"/>
    <line x1="860" y1="80" x2="870" y2="94"/>
  </g>
  <rect x="938" y="50" width="84" height="34" rx="6" fill="#fff" stroke="#ec4899" stroke-width="2"/>
  <rect x="1058" y="50" width="84" height="34" rx="6" fill="#fff" stroke="#ec4899" stroke-width="2"/>
  <g stroke="#f472b6" stroke-width="2" stroke-dasharray="5 5">
    <line x1="860" y1="104" x2="860" y2="212"/>
    <line x1="980" y1="84" x2="980" y2="212"/>
    <line x1="1100" y1="84" x2="1100" y2="212"/>
  </g>
  <rect x="974" y="112" width="12" height="88" rx="2" fill="#fff" stroke="#ec4899" stroke-width="2"/>
  <rect x="1094" y="138" width="12" height="38" rx="2" fill="#fff" stroke="#ec4899" stroke-width="2"/>
  <g stroke="#db2777" stroke-width="2">
    <line x1="862" y1="118" x2="972" y2="118" marker-end="url(#solid)"/>
    <line x1="988" y1="144" x2="1092" y2="144" marker-end="url(#solid)"/>
    <line x1="1092" y1="170" x2="988" y2="170" stroke-dasharray="6 5" marker-end="url(#open)"/>
    <line x1="972" y1="194" x2="862" y2="194" stroke-dasharray="6 5" marker-end="url(#open)"/>
  </g>
</svg>
